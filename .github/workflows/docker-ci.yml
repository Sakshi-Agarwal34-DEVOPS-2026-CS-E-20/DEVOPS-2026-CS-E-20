name: Docker Build & Health Check CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'weekly_reports/**'
      - '*.pdf'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t lumen-luxe:ci .

      - name: Run Test Container
        run: |
          docker run -d --name lumen-luxe-ci -p 5000:5000 -e NODE_ENV=production lumen-luxe:ci
          sleep 5

      - name: Verify Health Endpoint
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:5000/api/health || exit 1

      - name: Stop Container
        if: always()
        run: |
          docker stop lumen-luxe-ci || true
          docker rm lumen-luxe-ci || true
